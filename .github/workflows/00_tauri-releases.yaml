name: tauri-releases
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/00_tauri-releases.yaml"
      - "cluster/applications/tauri-releases/**"
      - "!**/*.md"
  schedule:
    - cron: '0 0 1 * *'
  workflow_run:
    workflows:
      - Release/taurin
      - Release/taurim
    types:
      - completed
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
jobs:
  runner:
    if: github.repository_owner == 'kaidotio' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  issue-github-token:
    if: github.repository_owner == 'kaidotio' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/reusable_issue-github-token.yaml
    with:
      profile: writer
    secrets: inherit
  assets:
    needs: runner
    if: ${{ !cancelled() && needs.runner.outputs.runner && github.event_name == 'workflow_run' }}
    timeout-minutes: 1
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          set -eo pipefail
          ready=$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[] | select(.state == "uploaded") | .name] as $names | ["latest.json", "taurim_latest.json"] | all(. as $name | $names | index($name))')
          # 20_taurin.yaml's updater job adds linux-x86_64-cuda to latest.json last
          if [ "${ready}" = "true" ]; then
            ready=$(gh release download "${RELEASE_TAG}" -p latest.json -O - | jq '.platforms | has("linux-x86_64-cuda")')
          fi
          if [ "${ready}" = "true" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          fi
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  publish:
    needs: [runner, assets, issue-github-token]
    if: ${{ !cancelled() && needs.runner.outputs.runner && (github.event_name != 'workflow_run' || needs.assets.outputs.ready == 'true') }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    environment: deployment
    env:
      IMAGE: tauri-releases
      KUSTOMIZATION: cluster/manifests/tauri-releases/base
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/
            cluster/applications/tauri-releases/
            cluster/manifests/tauri-releases/base/
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/docker-build/tauri-releases
          key: ${{ runner.os }}-tauri-releases-docker-${{ hashFiles('cluster/applications/tauri-releases/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-tauri-releases-docker-
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "DOCKER_CONFIG=${{ runner.temp }}/.docker" >> $GITHUB_ENV
      - uses: $/.github/actions/setup-docker
      - run: |
          set -eo pipefail
          IMAGE_PATH="${GITHUB_REPOSITORY}/${IMAGE}"
          GHCR_IMAGE="ghcr.io/${IMAGE_PATH}"
          TAG="${GITHUB_REF##*/}"
          opt=""
          if [ -d "${{ runner.temp }}/.cache/docker-build/tauri-releases" ]; then
            opt="--cache-from type=local,src=${{ runner.temp }}/.cache/docker-build/tauri-releases"
          else
            opt="--cache-from type=registry,ref=${GHCR_IMAGE}:cache"
          fi
          (
            cd cluster/applications/tauri-releases

            mkdir -p releases/taurin
            if gh release download "${RELEASE_TAG}" -p "latest.json" -D releases/taurin; then
              names=$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[] | {(.apiUrl): .name}] | add')
              jq --argjson names "${names}" --arg base_url "${BASE_URL}/taurin" '.platforms |= map_values(.url = $base_url + "/" + ($names[.url] // error("asset not found for url: \(.url)")))' releases/taurin/latest.json > releases/taurin/latest.json.tmp
              mv releases/taurin/latest.json.tmp releases/taurin/latest.json
              # taurin builds released before the move to /taurin/ poll /latest.json
              cp releases/taurin/latest.json releases/latest.json
              gh release download "${RELEASE_TAG}" -p "${RELEASE_NAME}_*" -p "${RELEASE_NAME}-*" -D releases/taurin
            fi

            mkdir -p releases/taurim
            if gh release download "${RELEASE_TAG}" -p "taurim_latest.json" -O releases/taurim/latest.json; then
              names=$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[] | {(.apiUrl): .name}] | add')
              jq --argjson names "${names}" --arg base_url "${BASE_URL}/taurim" '.platforms |= map_values(.url = $base_url + "/" + ($names[.url] // error("asset not found for url: \(.url)")))' releases/taurim/latest.json > releases/taurim/latest.json.tmp
              mv releases/taurim/latest.json.tmp releases/taurim/latest.json
              gh release download "${RELEASE_TAG}" -p "taurim_*.apk" -D releases/taurim
              mkdir -p releases/.well-known
              gh release download "${RELEASE_TAG}" -p "taurim_assetlinks.json" -O releases/.well-known/assetlinks.json
            fi

            docker buildx build --output "type=docker,name=${GHCR_IMAGE}:${TAG},push=false" ${opt} --cache-to "type=local,mode=max,dest=${{ runner.temp }}/.cache/docker-build/tauri-releases" --cache-to "type=registry,ref=${GHCR_IMAGE}:cache,mode=max" .
          )
          DIGEST=$(docker push "${GHCR_IMAGE}:${TAG}" | grep -Eo "sha256:[a-f0-9]{64}")

          if [ -n "$KUSTOMIZATION" ]; then
            git config --global user.email "kaidotio@gmail.com"
            git config --global user.name "kaidotio"
            TOKEN=$(echo "$ENCRYPTED_TOKEN" | base64 -d | gpg -dq --batch --passphrase-file <(printf '%s' "$GPG_PASSPHRASE"))
            echo "::add-mask::$TOKEN"
            export GH_TOKEN="$TOKEN"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            branch="${IMAGE//\//-}"
            git checkout -b "${branch}"

            IFS_BAK=$IFS
            IFS=,
            targets=($KUSTOMIZATION)
            IFS=$IFS_BAK
            for target in "${targets[@]}"; do
              (
                cd "${target}"
                kustomize edit set image "${GHCR_IMAGE}=${GHCR_IMAGE}@${DIGEST}"
              )
            done

            git add "${targets[@]}"
            if git commit -m "Deploy ${IMAGE}"; then
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              git diff --quiet "origin/${{ github.ref_name }}..${branch}" && exit 0
              git push -f origin "${branch}"
              if [ $(gh pr list --head "${branch}" --json id | jq '. | length') -eq 0 ]; then
                gh pr create --title "Update ${IMAGE}" --body "${GHCR_IMAGE}@${DIGEST}" --head "${branch}"
              fi
            fi
          fi
        env:
          RELEASE_NAME: taurin
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          BASE_URL: https://tauri-releases-public.kaidotio.dev
          GITHUB_TOKEN: ${{ github.token }}
          ENCRYPTED_TOKEN: ${{ needs.issue-github-token.outputs.encrypted_token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  scan:
    if: ${{ !cancelled() && github.repository_owner == 'kaidotio' && needs.publish.result == 'success' }}
    needs: [runner, publish]
    uses: ./.github/workflows/reusable_scan-image.yaml
    with:
      image: ghcr.io/${{ github.repository }}/tauri-releases:${{ github.ref_name }}
      runner: ${{ needs.runner.outputs.runner }}
    secrets: inherit
