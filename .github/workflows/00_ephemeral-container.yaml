name: ephemeral-container
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/00_ephemeral-container.yaml"
      - "cluster/applications/ephemeral-container/**"
      - "!**/*.md"
  workflow_run:
    workflows:
      - Release/armyknife
      - Release/insight
    types:
      - completed
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
jobs:
  runner:
    if: github.repository_owner == 'kaidotio' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local
      fallback-runner: ubuntu-24.04
    secrets: inherit
  assets:
    needs: runner
    if: ${{ !cancelled() && needs.runner.outputs.runner && github.event_name == 'workflow_run' }}
    timeout-minutes: 1
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          set -eo pipefail
          ready=$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[] | select(.state == "uploaded") | .name] as $names | ["armyknife", "insight", "l7sniff"] | all(. as $binary | $names | any(test("^\($binary)_.+_linux_amd64$")))')
          if [ "${ready}" = "true" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          fi
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  publish:
    needs: [runner, assets]
    if: ${{ !cancelled() && needs.runner.outputs.runner && (github.event_name != 'workflow_run' || needs.assets.outputs.ready == 'true') }}
    timeout-minutes: 60
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    env:
      IMAGE: ephemeral-container
      KUSTOMIZATION: "cluster/manifests/slack-logger/base"
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/
            cluster/applications/ephemeral-container/
            cluster/manifests/slack-logger/base/
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.cache/docker-build/ephemeral-container
          key: ${{ runner.os }}-ephemeral-container-docker-${{ hashFiles('cluster/applications/ephemeral-container/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-ephemeral-container-docker-
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "DOCKER_CONFIG=${{ runner.temp }}/.docker" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-docker
      - run: |
          set -eo pipefail
          IMAGE_PATH="${GITHUB_REPOSITORY}/${IMAGE}"
          GHCR_IMAGE="ghcr.io/${IMAGE_PATH}"
          TAG="${GITHUB_REF##*/}"
          opt=""
          if [ -d "${{ runner.temp }}/.cache/docker-build/ephemeral-container" ]; then
            opt="--cache-from type=local,src=${{ runner.temp }}/.cache/docker-build/ephemeral-container"
          else
            opt="--cache-from type=registry,ref=${GHCR_IMAGE}:cache"
          fi
          (
            cd cluster/applications/ephemeral-container

            mkdir -p bin
            gh release download "${RELEASE_TAG}" -p "armyknife_*_linux_amd64" -p "insight_*_linux_amd64" -p "l7sniff_*_linux_amd64" -D bin
            install -m 755 bin/armyknife_*_linux_amd64 bin/armyknife
            install -m 755 bin/insight_*_linux_amd64 bin/insight
            install -m 755 bin/l7sniff_*_linux_amd64 bin/l7sniff

            docker buildx build --output "type=docker,name=${GHCR_IMAGE}:${TAG},push=false" ${opt} --cache-to "type=local,mode=max,dest=${{ runner.temp }}/.cache/docker-build/ephemeral-container" --cache-to "type=registry,ref=${GHCR_IMAGE}:cache,mode=max" .
          )
          DIGEST=$(docker push "${GHCR_IMAGE}:${TAG}" | grep -Eo "sha256:[a-f0-9]{64}")

          if [ -n "$KUSTOMIZATION" ]; then
            git config --global user.email "kaidotio@gmail.com"
            git config --global user.name "kaidotio"
            branch="${IMAGE//\//-}"
            git checkout -b "${branch}"

            IFS_BAK=$IFS
            IFS=,
            targets=($KUSTOMIZATION)
            IFS=$IFS_BAK
            for target in "${targets[@]}"; do
              (
                cd "${target}"
                kustomize edit set image "${GHCR_IMAGE}=${GHCR_IMAGE}@${DIGEST}"
              )
            done

            git add "${targets[@]}"
            if git commit -m "Deploy ${IMAGE}"; then
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              git diff --quiet "origin/${{ github.ref_name }}..${branch}" && exit 0
              git push -f origin "${branch}"
              if [ $(gh pr list --head "${branch}" --json id | jq '. | length') -eq 0 ]; then
                gh pr create --title "Update ${IMAGE}" --body "${GHCR_IMAGE}@${DIGEST}" --head "${branch}"
              fi
            fi
          fi
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          GITHUB_TOKEN: ${{ github.token }}
  scan:
    if: ${{ !cancelled() && github.repository_owner == 'kaidotio' && needs.publish.result == 'success' }}
    needs: [runner, publish]
    uses: ./.github/workflows/reusable_scan-image.yaml
    with:
      image: ghcr.io/${{ github.repository }}/ephemeral-container:${{ github.ref_name }}
      runner: ${{ needs.runner.outputs.runner }}
    secrets: inherit
