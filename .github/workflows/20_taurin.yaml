name: Release/taurin
on:
  release:
    types:
      - created
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  windows-runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Windows
      fallback-runner: windows-latest
    secrets: inherit
  release:
    needs: [runner, windows-runner]
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # No macOS user, and the platform bills at ten times the Linux rate
          #- platform: macos-latest
          #  args: "--target aarch64-apple-darwin"
          - platform: ubuntu-24.04
            args: "--bundles appimage"
          # AppImage cannot bundle libcuda.so.1 (NVIDIA driver lib absent on CI); ship deb/rpm only
          - platform: ubuntu-24.04
            args: "--features cuda --bundles deb rpm"
          - platform: windows-latest
            args: ""
          - platform: windows-latest
            args: "--features cuda --bundles nsis"
    runs-on: ${{ matrix.platform == 'ubuntu-24.04' && (needs.runner.outputs.runner && fromJSON(needs.runner.outputs.runner) || 'ubuntu-24.04') || matrix.platform == 'windows-latest' && (needs.windows-runner.outputs.runner && fromJSON(needs.windows-runner.outputs.runner) || 'windows-latest') || matrix.platform }}
    environment: deployment
    steps:
      # Windows git rejects the ':' paths under files/, and sparse checkout does not help. checkout swaps HOME, so the setting goes through the environment.
      - if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -eo pipefail
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=core.protectNTFS"
            echo "GIT_CONFIG_VALUE_0=false"
          } >> "$GITHUB_ENV"
      - if: contains(matrix.platform == 'windows-latest' && needs.windows-runner.outputs.runner || matrix.platform != 'windows-latest' && needs.runner.outputs.runner, 'local')
        shell: bash
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/
            taurin/
            bin/
            packages/
      - if: matrix.platform == 'ubuntu-24.04' && contains(matrix.args, 'cuda') && !contains(needs.runner.outputs.runner, 'local')
        run: bash .github/scripts/cleanup.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: taurin/package-lock.json
      - if: contains(matrix.platform == 'windows-latest' && needs.windows-runner.outputs.runner || matrix.platform != 'windows-latest' && needs.runner.outputs.runner, 'local')
        shell: bash
        run: echo "RUSTUP_HOME=${{ runner.temp }}/rustup" >> $GITHUB_ENV
      # The AppImage runtime tauri runs linuxdeploy through extracts under $TMPDIR, falling back to the world-writable /tmp: https://github.com/AppImage/type2-runtime/blob/main/src/runtime/runtime.c
      - if: contains(matrix.args, 'appimage') && contains(needs.runner.outputs.runner, 'local')
        run: echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - if: ${{ !contains(matrix.platform == 'windows-latest' && needs.windows-runner.outputs.runner || matrix.platform != 'windows-latest' && needs.runner.outputs.runner, 'local') }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-taurin-cargo-${{ hashFiles('taurin/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-taurin-cargo-
      - uses: actions/cache@v6.1.0
        with:
          path: taurin/src-tauri/target
          key: ${{ runner.os }}-taurin-target-${{ hashFiles('taurin/src-tauri/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-taurin-target-
      - if: matrix.platform == 'ubuntu-24.04' && !contains(needs.runner.outputs.runner, 'local')
        run: |
          set -eo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - if: matrix.platform == 'ubuntu-24.04' && contains(matrix.args, 'cuda') && !contains(needs.runner.outputs.runner, 'local')
        run: |
          set -eo pipefail
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -y
          # The CUDA build links major-versioned sonames such as libcudart.so.13 and auto-updates over itself
          # taurin/src-tauri/.cargo/config.toml pins CUDARC_CUDA_VERSION, which has to stay within this toolkit's major version
          sudo apt-get install -y --no-install-recommends cuda-toolkit-13-5
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          # cudaforge, which builds candle-kernels, otherwise reads the target from nvidia-smi, which a GPU-less runner lacks
          # candle's PTX runs only on a driver supporting this toolkit (https://docs.nvidia.com/deploy/cuda-compatibility/minor-version-compatibility.html)
          echo "CUDA_COMPUTE_CAP=80" >> "$GITHUB_ENV"
      - if: matrix.platform == 'ubuntu-24.04' && contains(matrix.args, 'cuda') && contains(needs.runner.outputs.runner, 'local')
        run: |
          set -eo pipefail
          echo "/opt/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_COMPUTE_CAP=80" >> "$GITHUB_ENV"
      - if: matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda') && !contains(needs.windows-runner.outputs.runner, 'local')
        shell: bash
        run: |
          set -eo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/cuda.exe" https://developer.download.nvidia.com/compute/cuda/13.5.0/network_installers/cuda_13.5.0_windows_x86_64_network.exe
          # https://docs.nvidia.com/cuda/cuda-installation-guide-microsoft-windows/index.html
          "${RUNNER_TEMP}/cuda.exe" -s nvcc_13.5 crt_13.5 nvvm_13.5 cccl_13.5 cudart_13.5 cublas_13.5 cublas_dev_13.5 curand_13.5 curand_dev_13.5 nvrtc_13.5 nvrtc_dev_13.5 visual_studio_integration_13.5
      - if: matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda')
        shell: bash
        run: |
          set -eo pipefail
          echo "CUDA_PATH=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.5" >> "$GITHUB_ENV"
          # MSBuild's CUDA 13.5.props takes CudaToolkitDir from CUDA_PATH_V13_5
          echo "CUDA_PATH_V13_5=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.5" >> "$GITHUB_ENV"
          echo "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.5\\bin" >> "$GITHUB_PATH"
          echo "CUDA_COMPUTE_CAP=80" >> "$GITHUB_ENV"
          # CCCL's cuda/std/__cccl/preprocessor.h stops with #error under cl.exe's traditional preprocessor
          echo "NVCC_APPEND_FLAGS=-Xcompiler=/Zc:preprocessor" >> "$GITHUB_ENV"
      # cudaforge runs nvcc directly, which takes the cl.exe on PATH as its host compiler (https://docs.nvidia.com/cuda/cuda-compiler-driver-nvcc/index.html)
      - if: matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda')
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - if: matrix.platform == 'macos-latest'
        run: |
          set -eo pipefail
          cat > "${RUNNER_TEMP}/ggml-override.cmake" <<'EOF'
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv8.5-a" CACHE STRING "" FORCE)
          EOF
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CMAKE_PROJECT_INCLUDE=${RUNNER_TEMP}/ggml-override.cmake" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          set -eo pipefail
          VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/^v//')
          bash ./bin/bump.sh "${VERSION}"
      - run: npm ci
        working-directory: taurin
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Windows CUDA run builds an NSIS installer of the same name as the other Windows run's, which tauri-action would replace
          releaseId: ${{ !(matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda')) && github.event.release.id || '' }}
          args: ${{ matrix.args }}
          projectPath: taurin
          # tauri-action assigns latest.json's unsuffixed linux-x86_64 key on every run, so a deb/rpm run landing after the AppImage one points the updater at the .deb
          uploadUpdaterJson: ${{ !contains(matrix.args, 'deb') }}
      - if: contains(matrix.args, 'cuda')
        shell: bash
        run: |
          set -eo pipefail
          VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/^v//')
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            ASSET="${RUNNER_TEMP}/taurin_${VERSION}_x64_cuda-setup.exe"
            cp "src-tauri/target/release/bundle/nsis/taurin_${VERSION}_x64-setup.exe" "${ASSET}"
          else
            ASSET="${RUNNER_TEMP}/taurin_${VERSION}_amd64_cuda"
            cp src-tauri/target/release/taurin "${ASSET}"
          fi
          npm run tauri -- signer sign "${ASSET}"
          gh release upload ${{ github.event.release.tag_name }} "${ASSET}" "${ASSET}.sig"
        working-directory: taurin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # The AppImage and Windows runs rewrite latest.json as they finish, so the CUDA entries are merged after both are done
  updater:
    needs: [runner, release]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ${{ needs.runner.outputs.runner && fromJSON(needs.runner.outputs.runner) || 'ubuntu-24.04' }}
    steps:
      - run: |
          set -eo pipefail
          VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/^v//')
          ASSET="taurin_${VERSION}_amd64_cuda"
          WINDOWS_ASSET="taurin_${VERSION}_x64_cuda-setup.exe"
          gh release download ${{ github.event.release.tag_name }} -p latest.json -p "${ASSET}.sig" -p "${WINDOWS_ASSET}.sig" -D "${RUNNER_TEMP}"
          url=$(gh release view ${{ github.event.release.tag_name }} --json assets | jq -re --arg name "${ASSET}" '.assets[] | select(.name == $name) | .apiUrl')
          windows_url=$(gh release view ${{ github.event.release.tag_name }} --json assets | jq -re --arg name "${WINDOWS_ASSET}" '.assets[] | select(.name == $name) | .apiUrl')
          jq --rawfile signature "${RUNNER_TEMP}/${ASSET}.sig" --arg url "${url}" --rawfile windows_signature "${RUNNER_TEMP}/${WINDOWS_ASSET}.sig" --arg windows_url "${windows_url}" '.platforms["linux-x86_64-cuda"] = {signature: $signature, url: $url} | .platforms["windows-x86_64-cuda"] = {signature: $windows_signature, url: $windows_url}' "${RUNNER_TEMP}/latest.json" > "${RUNNER_TEMP}/latest.json.tmp"
          mv "${RUNNER_TEMP}/latest.json.tmp" "${RUNNER_TEMP}/latest.json"
          gh release upload ${{ github.event.release.tag_name }} "${RUNNER_TEMP}/latest.json" --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
