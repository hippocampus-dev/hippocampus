name: pages
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/20_pages.yaml
      - images/Kai.jpg
      - slides/**
      - .npmrc
      - package.json
      - package-lock.json
      - bin/strip-slide-image-metadata.sh
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  deploy:
    needs: runner
    if: ${{ !cancelled() && needs.runner.outputs.runner }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            images/Kai.jpg
            slides/
            .npmrc
            package.json
            package-lock.json
            bin/strip-slide-image-metadata.sh
          sparse-checkout-cone-mode: false
      - run: mkdir -p dist
      - if: ${{ !contains(needs.runner.outputs.runner, 'local') }}
        run: |
          set -eo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libjpeg-turbo-progs gifsicle
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - name: Build slides
        run: |
          set -eo pipefail
          npm ci
          npm --no-ignore-scripts run marp:build

          mkdir -p dist/slides
          cp -Lr slides/images dist/slides/
          cp slides/*.html dist/slides/
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
