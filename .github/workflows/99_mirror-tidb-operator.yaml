name: Mirror tidb-operator
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/99_mirror-tidb-operator.yaml"
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  issue-github-token:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_issue-github-token.yaml
    with:
      profile: writer
    secrets: inherit
  mirror:
    needs: [runner, issue-github-token]
    if: ${{ !cancelled() && needs.runner.outputs.runner }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    environment: deployment
    env:
      IMAGE: pingcap/tidb-operator
      TAG: v1.6.3
      KUSTOMIZATION: "cluster/manifests/tidb-operator/base"
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "DOCKER_CONFIG=${{ runner.temp }}/.docker" >> $GITHUB_ENV
      - run: docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" -p "${GITHUB_TOKEN}"
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/bin/
            cluster/manifests/tidb-operator/base/
      - run: bash .github/workflows/bin/mirror.sh
        env:
          ENCRYPTED_TOKEN: ${{ needs.issue-github-token.outputs.encrypted_token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  scan:
    if: ${{ !cancelled() && github.repository_owner == 'kaidotio' && needs.mirror.result == 'success' }}
    needs: [runner, mirror]
    uses: ./.github/workflows/reusable_scan-image.yaml
    with:
      image: ghcr.io/${{ github.repository }}/mirror/pingcap/tidb-operator:v1.6.3
      runner: ${{ needs.runner.outputs.runner }}
    secrets: inherit
