name: Test/fuse-csi-driver
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/actions/setup-kubernetes-e2e/**"
      - ".github/workflows/40_fuse-csi-driver.yaml"
      - "cluster/applications/fuse-csi-driver/**"
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    if: github.repository_owner == 'kaidotio' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.state == 'open'))
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/actions/setup-kubernetes-e2e/
            cluster/applications/fuse-csi-driver/
      - uses: $/.github/actions/setup-kubernetes-e2e
      - run: make e2e SHELL=bash
        working-directory: cluster/applications/fuse-csi-driver
