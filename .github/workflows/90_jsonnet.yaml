name: jsonnet
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/90_jsonnet.yaml"
      - "cluster/manifests/grafana/jsonnetfile.json"
      - "cluster/manifests/grafana/jsonnetfile.lock.json"
      - "cluster/manifests/grafana/jsonnet/**"
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  id-token: write
env:
  SHARDS: 5
jobs:
  runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  map:
    needs: runner
    if: ${{ !cancelled() && needs.runner.outputs.runner }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    strategy:
      fail-fast: true
      matrix:
        shards: [0, 1, 2, 3, 4]
    env:
      JSONNET_BUNDLER_VOLUME: jsonnet-bundler-${{ github.run_id }}-${{ matrix.shards }}
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            cluster/manifests/grafana/
      - run: |
          set -eo pipefail
          tasks=()
          makeAll=0
          git diff ${{ github.event.before }}..${{ github.sha }} --name-only --diff-filter=d | while IFS= read -r file; do
            if [[ $file == .github/workflows/90_jsonnet.yaml ]] || [[ $file == cluster/manifests/grafana/jsonnetfile.json ]] || [[ $file == cluster/manifests/grafana/jsonnetfile.lock.json ]]; then
              makeAll=1
              break
            elif [[ $file == cluster/manifests/grafana/jsonnet/**/*.libsonnet ]]; then
              grep -l -E "import \".*$(basename $file)\"" -r jsonnet | while IFS= read -r importedFile; do
                tasks+=($(echo $importedFile | sed -r 's|jsonnet/||' | sed -r 's|([^/]+).jsonnet|zz_generated.\1.json|'))
              done
            elif [[ $file == cluster/manifests/grafana/jsonnet/**/*.jsonnet ]]; then
              relativePath=${file#cluster/manifests/grafana/}
              tasks+=($(echo $relativePath | sed -r 's|jsonnet/||' | sed -r 's|([^/]+).jsonnet|zz_generated.\1.json|'))
            fi
          done

          if [ $makeAll -eq 1 ]; then
            find jsonnet -type f -name '*.jsonnet' | sed -r 's|jsonnet/||' | sed -r 's|([^/]+).jsonnet|zz_generated.\1.json|' | while IFS= read -r jsonnetFile; do
              tasks+=($jsonnetFile)
            done
          fi

          if [ ${#tasks[@]} -eq 0 ]; then
            exit 0
          fi

          t=$(mktemp)
          i=0
          echo "${tasks[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' ' | while IFS= read -r task; do
            if [ $((i % SHARDS)) -eq ${{ matrix.shards }} ]; then
              echo $task >> $t
            fi
            i=$((i + 1))
          done

          if [ $(wc -l < $t) -eq 0 ]; then
            exit 0
          fi

          make install
          make -j4 $(cat $t)

          git config --global user.name "kaidotio"
          git config --global user.email "kaidotio@gmail.com"
          branch=jsonnet-${{ github.run_id }}-${{ matrix.shards }}
          git checkout -b "${branch}"

          git add .
          if git commit -m "Map ${{ matrix.shards }}"; then
            git push -f origin "${branch}"
          fi
        working-directory: cluster/manifests/grafana
      - if: always()
        run: docker volume rm -f "${JSONNET_BUNDLER_VOLUME}"
  issue-github-token:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_issue-github-token.yaml
    with:
      profile: writer
    secrets: inherit
  reduce:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    environment: deployment
    needs: [runner, map, issue-github-token]
    if: ${{ !cancelled() && needs.runner.outputs.runner && needs.map.result == 'success' && needs.issue-github-token.result == 'success' }}
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -eo pipefail
          git config --global user.name "kaidotio"
          git config --global user.email "kaidotio@gmail.com"
          TOKEN=$(echo "$ENCRYPTED_TOKEN" | base64 -d | gpg -dq --batch --passphrase-file <(printf '%s' "$GPG_PASSPHRASE"))
          echo "::add-mask::$TOKEN"
          export GH_TOKEN="$TOKEN"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          BRANCH_NAME=jsonnet-${{ github.run_id }}
          git checkout -b "$BRANCH_NAME"

          for ((i=0; i<SHARDS; i++)); do
            branch=jsonnet-${{ github.run_id }}-$i
            if git fetch origin "${branch}"; then
              git merge --squash --no-commit "origin/${branch}"
              git push origin ":${branch}"
            fi
          done

          if git commit -m "Make all"; then
            git push origin "$BRANCH_NAME"
            gh pr create --title "jsonnet build" --body "Automatically generated by jsonnet workflow."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ENCRYPTED_TOKEN: ${{ needs.issue-github-token.outputs.encrypted_token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
