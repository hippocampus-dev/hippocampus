name: Test/taurim
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/40_taurim.yaml"
      - ".cargo/**"
      - "taurim/src-tauri/**"
      - "rust-toolchain.toml"
      - "taurin/src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.repository_owner == 'kaidotio' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.state == 'open'))
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .cargo/
            taurim/
            rust-toolchain.toml
            taurin/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - run: rustup target add aarch64-linux-android
        working-directory: taurim/src-tauri
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-taurim-cargo-${{ hashFiles('taurim/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-taurim-cargo-
      - uses: actions/cache@v6.1.0
        with:
          path: taurim/src-tauri/target
          key: ${{ runner.os }}-taurim-target-${{ hashFiles('taurim/src-tauri/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-taurim-target-
      # ring, which rustls depends on, compiles C for the target
      - run: |
          set -eo pipefail
          bin="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_aarch64_linux_android="${bin}/aarch64-linux-android26-clang" AR_aarch64_linux_android="${bin}/llvm-ar" cargo check --target aarch64-linux-android
        working-directory: taurim/src-tauri
