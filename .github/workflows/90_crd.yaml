name: crd
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/90_crd.yaml"
      - ".idea/crd/kustomization.yaml"
      - "cluster/applications/dedicated-container-ingress-controller/manifests/crd/**"
      - "cluster/applications/envoy-ratelimit-controller/manifests/crd/**"
      - "cluster/applications/github-actions-exporter-controller/manifests/crd/**"
      - "cluster/applications/github-actions-runner-controller/manifests/crd/**"
      - "cluster/applications/grafana-manifest-controller/manifests/crd/**"
      - "cluster/applications/owasp-zap-controller/manifests/crd/**"
      - "cluster/applications/snapshot-controller/manifests/crd/**"
      - "cluster/manifests/atlas-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/cert-manager/base/custom_resource_definition.yaml"
      - "cluster/manifests/k6-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/tidb-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/vitess-operator/base/custom_resource_definition.yaml"
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  deploy:
    if: github.repository_owner == 'kaidotio'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GOPATH: /tmp/go
      GOBIN: /tmp/build-tools/bin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .idea/crd/
            cluster/applications/dedicated-container-ingress-controller/manifests/crd/
            cluster/applications/envoy-ratelimit-controller/manifests/crd/
            cluster/applications/github-actions-exporter-controller/manifests/crd/
            cluster/applications/github-actions-runner-controller/manifests/crd/
            cluster/applications/grafana-manifest-controller/manifests/crd/
            cluster/applications/owasp-zap-controller/manifests/crd/
            cluster/applications/snapshot-controller/manifests/crd/
            cluster/manifests/atlas-operator/base/
            cluster/manifests/cert-manager/base/
            cluster/manifests/k6-operator/base/
            cluster/manifests/tidb-operator/base/
            cluster/manifests/vitess-operator/base/
      - run: |
          set -eo pipefail
          go install sigs.k8s.io/kustomize/kustomize/v5@latest
      - run: |
          set -eo pipefail
          BRANCH_NAME=crd-${{ github.run_id }}

          git config --global user.name "kaidotio"
          git config --global user.email "kaidotio@gmail.com"
          git checkout -b "$BRANCH_NAME"

          "${GOBIN}/kustomize" build --load-restrictor LoadRestrictionsNone . | yq 'select(.kind == "CustomResourceDefinition")' > crd.yaml
          git add crd.yaml

          if git commit -m "kustomize build"; then
            git push origin "$BRANCH_NAME"
            gh pr create --title "kustomize build" --body "Automatically generated by crd workflow."
          fi
        working-directory: .idea/crd
        env:
          GH_TOKEN: ${{ github.token }}
