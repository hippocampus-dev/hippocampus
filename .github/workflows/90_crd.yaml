name: crd
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/90_crd.yaml"
      - ".idea/crd/kustomization.yaml"
      - "cluster/applications/dedicated-container-ingress-controller/manifests/crd/**"
      - "cluster/applications/envoy-ratelimit-controller/manifests/crd/**"
      - "cluster/applications/github-actions-exporter-controller/manifests/crd/**"
      - "cluster/applications/github-actions-runner-controller/manifests/crd/**"
      - "cluster/applications/grafana-manifest-controller/manifests/crd/**"
      - "cluster/applications/owasp-zap-controller/manifests/crd/**"
      - "cluster/applications/snapshot-controller/manifests/crd/**"
      - "cluster/manifests/atlas-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/cert-manager/base/custom_resource_definition.yaml"
      - "cluster/manifests/k6-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/tidb-operator/base/custom_resource_definition.yaml"
      - "cluster/manifests/vitess-operator/base/custom_resource_definition.yaml"
  workflow_dispatch:
    inputs: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  runner:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_dynamic-runner.yaml
    with:
      labels: self-hosted,local,Linux
      fallback-runner: ubuntu-24.04
    secrets: inherit
  issue-github-token:
    if: github.repository_owner == 'kaidotio'
    uses: ./.github/workflows/reusable_issue-github-token.yaml
    with:
      profile: writer
    secrets: inherit
  deploy:
    needs: [runner, issue-github-token]
    if: ${{ !cancelled() && needs.runner.outputs.runner && needs.issue-github-token.result == 'success' }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    environment: deployment
    steps:
      - if: contains(needs.runner.outputs.runner, 'local')
        run: echo "GIT_CONFIG_GLOBAL=${{ runner.temp }}/gitconfig" >> $GITHUB_ENV
      - run: |
          echo "GOPATH=${{ runner.temp }}/go" >> $GITHUB_ENV
          echo "GOBIN=${{ runner.temp }}/bin" >> $GITHUB_ENV
      - run: git config --global submodule.recurse false
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .idea/crd/
            cluster/applications/dedicated-container-ingress-controller/manifests/crd/
            cluster/applications/envoy-ratelimit-controller/manifests/crd/
            cluster/applications/github-actions-exporter-controller/manifests/crd/
            cluster/applications/github-actions-runner-controller/manifests/crd/
            cluster/applications/grafana-manifest-controller/manifests/crd/
            cluster/applications/owasp-zap-controller/manifests/crd/
            cluster/applications/snapshot-controller/manifests/crd/
            cluster/manifests/atlas-operator/base/
            cluster/manifests/cert-manager/base/
            cluster/manifests/k6-operator/base/
            cluster/manifests/tidb-operator/base/
            cluster/manifests/vitess-operator/base/
      - run: |
          set -eo pipefail
          go install sigs.k8s.io/kustomize/kustomize/v5@latest
          go install github.com/mikefarah/yq/v4@latest
      - run: |
          set -eo pipefail
          BRANCH_NAME=crd-${{ github.run_id }}

          git config --global user.name "kaidotio"
          git config --global user.email "kaidotio@gmail.com"
          TOKEN=$(echo "$ENCRYPTED_TOKEN" | base64 -d | gpg -dq --batch --passphrase-file <(printf '%s' "$GPG_PASSPHRASE"))
          echo "::add-mask::$TOKEN"
          export GH_TOKEN="$TOKEN"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "$BRANCH_NAME"

          "${GOBIN}/kustomize" build --load-restrictor LoadRestrictionsNone . | "${GOBIN}/yq" 'select(.kind == "CustomResourceDefinition")' > crd.yaml
          git add crd.yaml

          if git commit -m "kustomize build"; then
            git push origin "$BRANCH_NAME"
            gh pr create --title "kustomize build" --body "Automatically generated by crd workflow."
          fi
        working-directory: .idea/crd
        env:
          GH_TOKEN: ${{ github.token }}
          ENCRYPTED_TOKEN: ${{ needs.issue-github-token.outputs.encrypted_token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
