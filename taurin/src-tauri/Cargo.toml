[package]
name = "taurin"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/ipc", "crates/ipc_build", "crates/ipc_macro"]

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

ipc_build = { path = "crates/ipc_build" }

[dependencies]
tauri = { version = "2.3.0", features = [] }
tokio = { version = "1.45.1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
regex = { version = "1" }
csv = { version = "~1.3" }
tauri-plugin-store = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-os = { version = "2" }

xcap = { version = "0.4.0" }
image = { version = "0.25.5" }
base64 = { version = "0.22.1" }

tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
futures-util = { version = "0.3.30" }

ipc = { path = "crates/ipc" }
bakery = { path = "../../packages/bakery" }
oauth-bridge = { path = "../../packages/oauth-bridge" }
openai = { path = "../../packages/openai" }
audio = { path = "../../packages/audio" }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-window-state = { version = "2" }

whisper-rs = { version = "0.16", optional = true }
candle-core = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
cpal = { version = "0.15", optional = true }
enigo = { version = "0.3", features = ["x11rb"], optional = true }
hyper = { version = "0.14.32", features = ["client", "server", "tcp", "http1", "stream"] }
hyper-rustls = { version = "0.23.0" }
rustls = { version = "0.20.4" }
webbrowser = { version = "0.5.0" }
url = { version = "2.5.1" }
getrandom = { version = "0.2", features = ["std"] }

[features]
cuda = ["dep:whisper-rs", "whisper-rs/cuda", "dep:cpal", "dep:enigo", "dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "candle-core/cuda", "candle-transformers/cuda"]

[dev-dependencies]
tokio = { version = "1.45.1" }

[profile.release]
strip = "symbols"
lto = true
panic = "abort"
