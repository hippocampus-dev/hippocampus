services:
  strata:
    profiles:
      - strata
      - full
    image: ghcr.io/niko1221/strata:0.2.7-cuda13
    runtime: nvidia
    environment:
      - FAMILY=qwen
      - MODEL=${STRATA_MODEL:-IQ3_XXS}
      - API_KEY=${STRATA_API_KEY:-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    stop_grace_period: 2m
    volumes:
      - type: volume
        source: strata-data
        target: /data
    networks:
      default: {}
      internal: {}
