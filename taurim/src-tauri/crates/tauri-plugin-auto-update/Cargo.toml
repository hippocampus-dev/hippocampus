[package]
name = "tauri-plugin-auto-update"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-auto-update"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
serde_json = { version = "1" }

[dependencies]
tauri = { version = "2" }
tauri-plugin = { version = "2" }
tauri-plugin-store = { version = "2" }
tokio = { version = "1.45.1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
semver = { version = "1", features = ["serde"] }
base64 = { version = "0.22.1" }
minisign-verify = { version = "0.2" }
hyper = { version = "0.14.32", features = ["client", "tcp", "http1", "stream"] }
hyper-rustls = { version = "0.23.0", default-features = false, features = ["webpki-tokio", "http1", "tls12"] }
rustls = { version = "0.20.4" }
url = { version = "2.5.1" }
getrandom = { version = "0.2", features = ["std"] }

[lib]
name = "tauri_plugin_auto_update"
crate-type = ["cdylib", "rlib"]

[features]
default = []
