[workspace]

[package]
name = "taurim"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-store = { version = "2" }
tokio = { version = "1.45.1", features = ["time"] }
minisign-verify = { version = "0.2" }

tauri-plugin-auto-update = { path = "crates/tauri-plugin-auto-update" }
tauri-plugin-gemini = { path = "crates/tauri-plugin-gemini" }
tauri-plugin-timer = { path = "crates/tauri-plugin-timer" }
tauri-plugin-speech = { path = "crates/tauri-plugin-speech" }
tauri-plugin-wake-on-lan = { path = "crates/tauri-plugin-wake-on-lan" }

[lib]
name = "taurim_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
