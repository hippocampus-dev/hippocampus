developer_instructions = "\n# Codex Execution Plans (ExecPlans):\n \nThis document describes the requirements for an execution plan (\"ExecPlan\"), a design document that a coding agent can follow to deliver a working feature or system change.\nTreat the reader as a complete beginner to this repository: they have only the current working tree and the single ExecPlan file you provide.\nThere is no memory of prior plans and no external context.\n \n## How to use ExecPlans and PLANS.md\n \nWhen authoring an executable specification (ExecPlan), follow PLANS.md _to the letter_.\nIf it is not in your context, refresh your memory by reading the entire PLANS.md file.\nBe thorough in reading (and re-reading) source material to produce an accurate specification.\nWhen creating a spec, start from the skeleton and flesh it out as you do your research.\n \nWhen implementing an executable specification (ExecPlan), do not prompt the user for \"next steps\"; simply proceed to the next milestone.\nKeep all sections up to date, add or split entries in the list at every stopping point to affirmatively state the progress made and next steps.\nResolve ambiguities autonomously, and commit frequently.\n \nWhen discussing an executable specification (ExecPlan), record decisions in a log in the spec for posterity; it should be unambiguously clear why any change to the specification was made.\nExecPlans are living documents, and it should always be possible to restart from _only_ the ExecPlan and no other work.\n \nWhen researching a design with challenging requirements or significant unknowns, use milestones to implement proof of concepts, \"toy implementations\", etc., that allow validating whether the user's proposal is feasible.\nRead the source code of libraries by finding or acquiring them, research deeply, and include prototypes to guide a fuller implementation.\n \n## Requirements\n \nNON-NEGOTIABLE REQUIREMENTS:\n \n* Every ExecPlan must be fully self-contained. Self-contained means that in its current form it contains all knowledge and instructions needed for a novice to succeed.\n* Every ExecPlan is a living document. Contributors are required to revise it as progress is made, as discoveries occur, and as design decisions are finalized. Each revision must remain fully self-contained.\n* Every ExecPlan must enable a complete novice to implement the feature end-to-end without prior knowledge of this repo.\n* Every ExecPlan must produce a demonstrably working behavior, not merely code changes to \"meet a definition\".\n* Every ExecPlan must define every term of art in plain language or do not use it.\n \nPurpose and intent come first.\nBegin by explaining, in a few sentences, why the work matters from a user's perspective: what someone can do after this change that they could not do before, and how to see it working.\nThen guide the reader through the exact steps to achieve that outcome, including what to edit, what to run, and what they should observe.\n \nThe agent executing your plan can list files, read files, search, run the project, and run tests.\nIt does not know any prior context and cannot infer what you meant from earlier milestones.\nRepeat any assumption you rely on.\nDo not point to external blogs or docs; if knowledge is required, embed it in the plan itself in your own words.\nIf an ExecPlan builds upon a prior ExecPlan and that file is checked in, incorporate it by reference.\nIf it is not, you must include all relevant context from that plan.\n \n## Formatting\n \nFormat and envelope are simple and strict.\nEach ExecPlan must be one single fenced code block labeled as `md` that begins and ends with triple backticks.\nDo not nest additional triple-backtick code fences inside; when you need to show commands, transcripts, diffs, or code, present them as indented blocks within that single fence.\nUse indentation for clarity rather than code fences inside an ExecPlan to avoid prematurely closing the ExecPlan's code fence.\nUse two newlines after every heading, use # and ## and so on, and correct syntax for ordered and unordered lists.\n \nWhen writing an ExecPlan to a Markdown (.md) file where the content of the file *is only* the single ExecPlan, you should omit the triple backticks.\n \nWrite in plain prose.\nPrefer sentences over lists.\nAvoid checklists, tables, and long enumerations unless brevity would obscure meaning.\nChecklists are permitted only in the `Progress` section, where they are mandatory.\nNarrative sections must remain prose-first.\n \n## Guidelines\n \nSelf-containment and plain language are paramount.\nIf you introduce a phrase that is not ordinary English (\"daemon\", \"middleware\", \"RPC gateway\", \"filter graph\"), define it immediately and remind the reader how it manifests in this repository (for example, by naming the files or commands where it appears).\nDo not say \"as defined previously\" or \"according to the architecture doc.\" Include the needed explanation here, even if you repeat yourself.\n \nAvoid common failure modes.\nDo not rely on undefined jargon.\nDo not describe \"the letter of a feature\" so narrowly that the resulting code compiles but does nothing meaningful.\nDo not outsource key decisions to the reader.\nWhen ambiguity exists, resolve it in the plan itself and explain why you chose that path.\nErr on the side of over-explaining user-visible effects and under-specifying incidental implementation details.\n \nAnchor the plan with observable outcomes.\nState what the user can do after implementation, the commands to run, and the outputs they should see.\nAcceptance should be phrased as behavior a human can verify (\"after starting the server, navigating to [http://localhost:8080/health](http://localhost:8080/health) returns HTTP 200 with body OK\") rather than internal attributes (\"added a HealthCheck struct\").\nIf a change is internal, explain how its impact can still be demonstrated (for example, by running tests that fail before and pass after, and by showing a scenario that uses the new behavior).\n \nSpecify repository context explicitly.\nName files with full repository-relative paths, name functions and modules precisely, and describe where new files should be created.\nIf touching multiple areas, include a short orientation paragraph that explains how those parts fit together so a novice can navigate confidently.\nWhen running commands, show the working directory and exact command line.\nWhen outcomes depend on environment, state the assumptions and provide alternatives when reasonable.\n \nBe idempotent and safe.\nWrite the steps so they can be run multiple times without causing damage or drift.\nIf a step can fail halfway, include how to retry or adapt.\nIf a migration or destructive operation is necessary, spell out backups or safe fallbacks.\nPrefer additive, testable changes that can be validated as you go.\n \nValidation is not optional.\nInclude instructions to run tests, to start the system if applicable, and to observe it doing something useful.\nDescribe comprehensive testing for any new features or capabilities.\nInclude expected outputs and error messages so a novice can tell success from failure.\nWhere possible, show how to prove that the change is effective beyond compilation (for example, through a small end-to-end scenario, a CLI invocation, or an HTTP request/response transcript).\nState the exact test commands appropriate to the project’s toolchain and how to interpret their results.\n \nCapture evidence.\nWhen your steps produce terminal output, short diffs, or logs, include them inside the single fenced block as indented examples.\nKeep them concise and focused on what proves success.\nIf you need to include a patch, prefer file-scoped diffs or small excerpts that a reader can recreate by following your instructions rather than pasting large blobs.\n \n## Milestones\n \nMilestones are narrative, not bureaucracy.\nIf you break the work into milestones, introduce each with a brief paragraph that describes the scope, what will exist at the end of the milestone that did not exist before, the commands to run, and the acceptance you expect to observe.\nKeep it readable as a story: goal, work, result, proof.\nProgress and milestones are distinct: milestones tell the story, progress tracks granular work.\nBoth must exist.\nNever abbreviate a milestone merely for the sake of brevity, do not leave out details that could be crucial to a future implementation.\n \nEach milestone must be independently verifiable and incrementally implement the overall goal of the execution plan.\n \n## Living plans and design decisions\n \n* ExecPlans are living documents. As you make key design decisions, update the plan to record both the decision and the thinking behind it. Record all decisions in the `Decision Log` section.\n* ExecPlans must contain and maintain a `Progress` section, a `Surprises & Discoveries` section, a `Decision Log`, and an `Outcomes & Retrospective` section. These are not optional.\n* When you discover optimizer behavior, performance tradeoffs, unexpected bugs, or inverse/unapply semantics that shaped your approach, capture those observations in the `Surprises & Discoveries` section with short evidence snippets (test output is ideal).\n* If you change course mid-implementation, document why in the `Decision Log` and reflect the implications in `Progress`. Plans are guides for the next contributor as much as checklists for you.\n* At completion of a major task or the full plan, write an `Outcomes & Retrospective` entry summarizing what was achieved, what remains, and lessons learned.\n \n# Prototyping milestones and parallel implementations\n \nIt is acceptable—-and often encouraged—-to include explicit prototyping milestones when they de-risk a larger change.\nExamples: adding a low-level operator to a dependency to validate feasibility, or exploring two composition orders while measuring optimizer effects.\nKeep prototypes additive and testable.\nClearly label the scope as “prototyping”; describe how to run and observe results; and state the criteria for promoting or discarding the prototype.\n \nPrefer additive code changes followed by subtractions that keep tests passing.\nParallel implementations (e.g., keeping an adapter alongside an older path during migration) are fine when they reduce risk or enable tests to continue passing during a large migration.\nDescribe how to validate both paths and how to retire one safely with tests.\nWhen working with multiple new libraries or feature areas, consider creating spikes that evaluate the feasibility of these features _independently_ of one another, proving that the external library performs as expected and implements the features we need in isolation.\n \n## Skeleton of a Good ExecPlan\n \n```md\n# <Short, action-oriented description>\n \nThis ExecPlan is a living document. The sections `Progress`, `Surprises & Discoveries`, `Decision Log`, and `Outcomes & Retrospective` must be kept up to date as work proceeds.\n \nIf PLANS.md file is checked into the repo, reference the path to that file here from the repository root and note that this document must be maintained in accordance with PLANS.md.\n \n## Purpose / Big Picture\n \nExplain in a few sentences what someone gains after this change and how they can see it working. State the user-visible behavior you will enable.\n \n## Progress\n \nUse a list with checkboxes to summarize granular steps. Every stopping point must be documented here, even if it requires splitting a partially completed task into two (“done” vs. “remaining”). This section must always reflect the actual current state of the work.\n \n- [x] (2025-10-01 13:00Z) Example completed step.\n- [ ] Example incomplete step.\n- [ ] Example partially completed step (completed: X; remaining: Y).\n \nUse timestamps to measure rates of progress.\n \n## Surprises & Discoveries\n \nDocument unexpected behaviors, bugs, optimizations, or insights discovered during implementation. Provide concise evidence.\n \n- Observation: …\n  Evidence: …\n \n## Decision Log\n \nRecord every decision made while working on the plan in the format:\n \n- Decision: …\n  Rationale: …\n  Date/Author: …\n \n## Outcomes & Retrospective\n \nSummarize outcomes, gaps, and lessons learned at major milestones or at completion. Compare the result against the original purpose.\n \n## Context and Orientation\n \nDescribe the current state relevant to this task as if the reader knows nothing. Name the key files and modules by full path. Define any non-obvious term you will use. Do not refer to prior plans.\n \n## Plan of Work\n \nDescribe, in prose, the sequence of edits and additions. For each edit, name the file and location (function, module) and what to insert or change. Keep it concrete and minimal.\n \n## Concrete Steps\n \nState the exact commands to run and where to run them (working directory). When a command generates output, show a short expected transcript so the reader can compare. This section must be updated as work proceeds.\n \n## Validation and Acceptance\n \nDescribe how to start or exercise the system and what to observe. Phrase acceptance as behavior, with specific inputs and outputs. If tests are involved, say \"run <project’s test command> and expect <N> passed; the new test <name> fails before the change and passes after>\".\n \n## Idempotence and Recovery\n \nIf steps can be repeated safely, say so. If a step is risky, provide a safe retry or rollback path. Keep the environment clean after completion.\n \n## Artifacts and Notes\n \nInclude the most important transcripts, diffs, or snippets as indented examples. Keep them concise and focused on what proves success.\n \n## Interfaces and Dependencies\n \nBe prescriptive. Name the libraries, modules, and services to use and why. Specify the types, traits/interfaces, and function signatures that must exist at the end of the milestone. Prefer stable names and paths such as `crate::module::function` or `package.submodule.Interface`. E.g.:\n \nIn crates/foo/planner.rs, define:\n \n    pub trait Planner {\n        fn plan(&self, observed: &Observed) -> Vec<Action>;\n    }\n```\n \nIf you follow the guidance above, a single, stateless agent -- or a human novice -- can read your ExecPlan from top to bottom and produce a working, observable result.\nThat is the bar: SELF-CONTAINED, SELF-SUFFICIENT, NOVICE-GUIDING, OUTCOME-FOCUSED.\n \nWhen you revise a plan, you must ensure your changes are comprehensively reflected across all sections, including the living document sections, and you must write a note at the bottom of the plan describing the change and the reason why.\nExecPlans must describe not just the what but the why for almost everything.\n"
