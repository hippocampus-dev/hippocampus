[package]
name = "oauth-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.45.1", features = ["macros", "rt", "sync", "time"] }
hyper = { version = "0.14.32", features = ["client", "server", "tcp", "http1"] }
hyper-rustls = { version = "0.23.0" }
rustls = { version = "0.20.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.66" }
url = { version = "2.5.1" }
webbrowser = { version = "0.5.0" }
getrandom = { version = "0.2", features = ["std"] }
base64 = { version = "0.22.1" }
sha2 = { version = "0.10.8" }

error = { path = "../error" }
