[package]
name = "teleput"
version = "0.1.0"
edition = "2024"

[dependencies]
error = { path = "../error" }
serde_binary = { path = "../serde_binary" }
serde = { version = "1.0.127", features = ["derive"] }
clap = { version = "4.5.38", features = ["derive"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
sha2 = { version = "0.10.9" }
rustix = { version = "1.1.3", features = ["time", "net", "pipe", "process"] }
x11rb = { version = "0.14.0", features = ["xinput", "xfixes", "xkb", "xtest"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"] }
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = { version = "0.3.16" }
