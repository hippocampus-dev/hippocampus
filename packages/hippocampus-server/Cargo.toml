[package]
name = "hippocampus-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tikv-jemallocator = { version = "0.6.0", optional = true }
clap = { version = "4.5.38", features = ["derive"] }
futures = { version = "0.3.16" }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = { version = "0.1.37" }
tracing-opentelemetry = { version = "0.30.0" }
tracing-subscriber = { version = "0.3.16", features = ["json", "env-filter"] }
axum = { version = "0.8.8" }
tonic = { version = "0.12" }
tonic-health = { version = "0.12" }
tower = { version = "0.5" }
prost = { version = "0.13" }
dotenv = { version = "0.15.0" }
opentelemetry = { version = "0.29.0" }
opentelemetry_sdk = { version = "0.29.0" }
opentelemetry-prometheus = { version = "0.29.0" }
opentelemetry-otlp = { version = "0.29.0", default-features = false, features = ["grpc-tonic", "trace", "tls", "tls-roots"] }
pprof = { version = "0.14.0", features = ["protobuf-codec"] }
libflate = { version = "2.1.0" }
prometheus = { version = "0.14.0" }
serde_json = { version = "1.0" }
rustc-hash = { version = "2.0.0" }

error = { path = "../error" }
opentelemetry-tracing = { path = "../opentelemetry-tracing" }
hippocampus-configuration = { path = "../hippocampus-configuration", features = ["gcs"] }
hippocampus-core = { path = "../hippocampus-core", features = ["ipadic"] }
hippocampusql = { path = "../hippocampusql" }
gcs = { path = "../gcs" }

[build-dependencies]
tonic-build = { version = "0.12" }

[features]
default = ["tracing"]
tracing = []
jemalloc = ["tikv-jemallocator"]
wasm = ["hippocampus-core/wasm", "hippocampus-configuration/wasm"]
sqlite = ["hippocampus-core/sqlite", "hippocampus-configuration/sqlite"]
cassandra = ["hippocampus-core/cassandra", "hippocampus-configuration/cassandra"]
