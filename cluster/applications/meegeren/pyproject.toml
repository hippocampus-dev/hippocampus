[project]
name = "meegeren"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "uvicorn==0.42.0",

    "fastapi==0.135.1",
    "python-multipart==0.0.32",

    "transformers==5.19.0",
    "diffusers==0.41.0",
    "accelerate==1.15.0",
    "gguf==0.19.0",
    "peft==0.21.0",
    "kernels==0.17.2",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "openai==3.26.0",
    "spandrel==0.4.2",

    "pydantic==2.12.5",
    "pydantic-settings==2.7.1",
    "pyyaml==6.0.3",

    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-exporter-prometheus==0.61b0",
    "prometheus-client==0.17.0",
    "python-dotenv==1.0.0",
    "python-json-logger==2.0.7",
]

# https://docs.astral.sh/uv/guides/integration/pytorch/#configuring-accelerators-with-optional-dependencies
[project.optional-dependencies]
cpu = [
    "torch==2.14.1",
    "torchvision==0.29.1",
]
cu130 = [
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

# The PyPI torch wheel bundles CUDA libraries, which cpu leaves out
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
