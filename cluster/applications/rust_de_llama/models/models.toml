[models."gemma-3-4b-it-Q4_K_M.gguf"]
n_ctx = 4096
n_parallel = 4
n_batch = 512
n_ubatch = 512
n_gpu_layers = 999
stop_sequences = ["<end_of_turn>", "<start_of_turn>"]
# Reuse a completed slot's KV prefix across turns to cut chat TTFT (single-tenant safe).
# A retained prefix is dropped once enough other requests have been batched past it, since holding
# it can widen the KV span every decode attends over.
prompt_cache = true
# KV cache precision; q8_0 halves K-cache memory near-losslessly (no flash-attention requirement).
type_k = "q8_0"
#type_v = "q8_0"     # rejected at load: a quantized V cache needs flash attention, which this path cannot guarantee.
#offload_kqv = false # keep KV in system RAM so a small-VRAM GPU can hold more weight layers; hardware-dependent, measure first.
#use_mlock = true    # pin weights against OS eviction; helps only RAM-pressured hosts.

[models."gemma-3-4b-it-Q4_K_M.gguf".prompt_format]
user_prefix = "<start_of_turn>user\n"
user_suffix = "<end_of_turn>\n"
assistant_prefix = "<start_of_turn>model\n"
assistant_suffix = "<end_of_turn>\n"
system_prefix = "<start_of_turn>system\n"
system_suffix = "<end_of_turn>\n"
add_generation_prompt = "<start_of_turn>model\n"

# Speculative decoding; off by default, validate throughput on real hardware.
# ngram = prompt-lookup suffix length, max_draft = tokens proposed per step.
# draft_model = same-family GGUF whose greedy proposals replace prompt-lookup (must share vocab).
#[models."gemma-3-4b-it-Q4_K_M.gguf".speculation]
#enabled = true
#ngram = 2
#max_draft = 4
#draft_model = "gemma-3-270m-it-Q4_K_M.gguf"

# Thinker-Talker audio pipeline: POST /v1/audio/speech with {"model": "voice"},
# or POST /v1/chat/completions with modalities = ["text", "audio"] and
# audio = { voice = "voice" } to speak a chat model's reply.
#
# The talker is an OuteTTS-style causal LM whose vocabulary encodes the
# decoder's codes as <|0|>..<|4095|>; the decoder is a WavTokenizer GGUF
# ("wavtokenizer-dec" arch). Both are pretrained, so this alone speaks:
#[audio_pipelines."voice"]
#talker_model = "OuteTTS-0.2-500M-F16.gguf"
#audio_decoder = "WavTokenizer-Large-75-F16.gguf"
#talker_n_ctx = 4096
#temperature = 0.7

# Adding thinker_model and projection_model (set both, or neither) routes the
# text through the thinker's hidden states instead of the talker's tokenizer.
# The projection GGUF is trained with notebooks/thinker-talker-projection.ipynb
# against both endpoints it bridges: input_dim must equal the thinker's n_embd
# and output_dim the talker's n_embd (both validated at load). Until it is
# trained, this path's output is noise-like.
