apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: skaffold-

labels:
  - includeSelectors: true
    pairs:
      variant: skaffold

namespace: skaffold-envoy-ratelimit-controller

resources:
  - ../manifests
  - namespace.yaml

patches:
  - path: patches/deployment.yaml
  - patch: |
      - op: replace
        path: /metadata/name
        value: ratelimits.skaffold.envoy-ratelimit.kaidotio.github.io
      - op: replace
        path: /spec/group
        value: skaffold.envoy-ratelimit.kaidotio.github.io
    target:
      kind: CustomResourceDefinition
      name: ratelimits.envoy-ratelimit.kaidotio.github.io
  - patch: |
      - op: add
        path: /rules/0
        value:
          apiGroups:
            - skaffold.envoy-ratelimit.kaidotio.github.io
          resources:
            - "*"
          verbs:
            - "*"
    target:
      kind: ClusterRole
      name: envoy-ratelimit-controller
