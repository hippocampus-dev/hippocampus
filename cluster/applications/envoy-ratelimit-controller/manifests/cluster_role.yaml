apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-ratelimit-controller
rules:
  - apiGroups:
      - envoy-ratelimit.kaidotio.github.io
    resources:
      - ratelimits
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - envoy-ratelimit.kaidotio.github.io
    resources:
      - ratelimits/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - envoy-ratelimit.kaidotio.github.io
    resources:
      - ratelimits/finalizers
    verbs:
      - update
  - apiGroups:
      - networking.istio.io
    resources:
      - envoyfilters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
