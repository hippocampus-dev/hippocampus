[package]
name = "envoy-markdownify"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "envoy-markdownify"
path = "src/main.rs"

[workspace]
resolver = "2"

[features]
default = ["tracing"]
tracing = []

[dependencies]
async-stream = { version = "0.3" }
clap = { version = "4.5.38", features = ["derive"] }
envoy-grpc-ext-proc = { version = "0.1.1" }
html-to-markdown-rs = { version = "2", default-features = false }
opentelemetry = { version = "0.29.0" }
opentelemetry-otlp = { version = "0.29.0", default-features = false, features = ["grpc-tonic", "trace", "tls", "tls-roots"] }
opentelemetry_sdk = { version = "0.29.0" }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1" }
tonic = { version = "0.14" }
tonic-otlp = { version = "0.12", package = "tonic" }
tracing = { version = "0.1.37" }
tracing-opentelemetry = { version = "0.30.0" }
tracing-subscriber = { version = "0.3.16", features = ["json", "env-filter"] }

[profile.release]
strip = "symbols"
lto = true
panic = "abort"
