apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: skaffold-

labels:
- includeSelectors: true
  pairs:
    variant: skaffold

namespace: skaffold-github-actions-runner-controller

resources:
- ../manifests
- namespace.yaml

images:
- digest: sha256:d9abaa749d86ef59cc575ed09b720a28799898905ee7746d341abd1d8f84b051
  name: bitnami/kubectl
  newName: ghcr.io/hippocampus-dev/hippocampus/mirror/bitnami/kubectl
- digest: sha256:33c69a810cc314b55c9e1e218ab9eb1b39034b28b023234854f093a207a87154
  name: registry
  newName: ghcr.io/hippocampus-dev/hippocampus/mirror/registry

# CRD does not support namePrefix
patches:
- path: patches/deployment.yaml
- patch: |
    - op: replace
      path: /metadata/name
      value: runners.skaffold.github-actions-runner.kaidotio.github.io
    - op: replace
      path: /spec/group
      value: skaffold.github-actions-runner.kaidotio.github.io
  target:
    kind: CustomResourceDefinition
    name: runners.github-actions-runner.kaidotio.github.io
- patch: |
    - op: replace
      path: /metadata/name
      value: scalesets.skaffold.github-actions-runner.kaidotio.github.io
    - op: replace
      path: /spec/group
      value: skaffold.github-actions-runner.kaidotio.github.io
  target:
    kind: CustomResourceDefinition
    name: scalesets.github-actions-runner.kaidotio.github.io
- patch: |
    - op: add
      path: /rules/0
      value:
        apiGroups:
          - skaffold.github-actions-runner.kaidotio.github.io
        resources:
          - "*"
        verbs:
          - "*"
  target:
    kind: ClusterRole
    name: github-actions-runner-controller

replacements:
- source:
    fieldPath: metadata.name
    kind: Service
    name: github-actions-runner-controller-registry
  targets:
  - fieldPaths:
    - spec.template.spec.initContainers.[name=fetch-nodeport].env.[name=SERVICE_NAME].value
    - spec.template.spec.containers.[name=controller].env.[name=SERVICE_NAME].value
    select:
      kind: Deployment
      name: github-actions-runner-controller
