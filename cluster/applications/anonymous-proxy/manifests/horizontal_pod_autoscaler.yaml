apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anonymous-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anonymous-proxy
  maxReplicas: 3
  minReplicas: 1
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: anonymous-proxy
        target:
          type: Utilization
          averageUtilization: 80
