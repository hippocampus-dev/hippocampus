apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy-wasm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy-wasm
  maxReplicas: 3
  minReplicas: 1
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: proxy-wasm
        target:
          type: Utilization
          averageUtilization: 80
