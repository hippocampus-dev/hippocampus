apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kube-crud-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kube-crud-server
  maxReplicas: 3
  minReplicas: 1
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: kube-crud-server
        target:
          type: Utilization
          averageUtilization: 80
