apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example
      annotations:
        skaffold.relocatable-volume-controller.kaidotio.github.io/volumes: data
    spec:
      containers:
        - name: example
          image: busybox
          command:
            - sleep
            - infinity
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
