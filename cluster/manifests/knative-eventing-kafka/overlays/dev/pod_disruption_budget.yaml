apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eventing-entity-operator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      strimzi.io/cluster: eventing
      strimzi.io/kind: Kafka
      strimzi.io/name: eventing-entity-operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-broker-receiver
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-eventing
      app.kubernetes.io/component: kafka-broker-receiver
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-channel-receiver
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-eventing
      app.kubernetes.io/component: kafka-channel-receiver
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-sink-receiver
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-eventing
      app.kubernetes.io/component: kafka-sink-receiver
