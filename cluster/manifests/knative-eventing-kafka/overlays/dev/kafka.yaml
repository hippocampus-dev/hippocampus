apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: eventing
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    replicas: 3
    jvmOptions:
      # -Xms only: Strimzi then omits -Xmx, so each node falls back to the JVM's
      # 25% MaxRAMPercentage of its own pool limit (vs Strimzi's injected 50%) and
      # the heap grows lazily. Keep -Xms below the smallest pool's 25% ceiling
      # (controller 1Gi -> 256Mi) so both pools stay lazy and -Xms never exceeds -Xmx
      -Xms: 128m
    config:
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      log.retention.hours: 1
      min.insync.replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          useServiceDnsDomain: true
  entityOperator:
    topicOperator:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi
    userOperator:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi
  kafkaExporter:
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/scheme: http
            prometheus.io/port: "9404"
            prometheus.io/path: /metrics
