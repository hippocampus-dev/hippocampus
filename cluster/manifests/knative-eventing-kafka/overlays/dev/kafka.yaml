apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: eventing
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    jvmOptions:
      -XX:
        InitialRAMPercentage: "12.5"
        MaxRAMPercentage: "25"
    config:
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      log.retention.hours: 1
      min.insync.replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          useServiceDnsDomain: true
    # Override upstream defaults (initialDelaySeconds: 15, failureThreshold: 3)
    livenessProbe:
      initialDelaySeconds: 60
      failureThreshold: 30
      # Strimzi substitutes this whole object rather than merging per field, so an omitted timeoutSeconds here would fall back to Kubernetes' own default of 1s rather than Strimzi's documented 5s: https://github.com/strimzi/strimzi-kafka-operator/blob/0.47.0/cluster-operator/src/main/java/io/strimzi/operator/cluster/model/ProbeUtils.java
      timeoutSeconds: 5
  entityOperator:
    topicOperator:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi
    userOperator:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi
  kafkaExporter:
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/scheme: http
            prometheus.io/port: "9404"
            prometheus.io/path: /metrics
