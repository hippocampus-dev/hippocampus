name: slack-logger
namespace: slack-logger
components:
  - name: slack-logger
    workloadType: deployment
    labels:
      app.kubernetes.io/component: ""
      app.kubernetes.io/name: slack-logger
    logs:
      grouping: kubernetes.slack-logger.slack-logger
      link: https://grafana.minikube.127.0.0.1.nip.io/explore?schemaVersion=1&panes=%7B%22default%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22%7Bgrouping%3D%5C%22kubernetes.slack-logger.slack-logger%5C%22%7D%22%7D%5D%7D%7D
    traces:
      serviceName: slack-logger
      link: https://grafana.minikube.127.0.0.1.nip.io/explore?schemaVersion=1&panes=%7B%22default%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22limit%22%3A20%2C%22query%22%3A%22%7Bresource.service.name%3D%5C%22slack-logger%5C%22%7D%22%2C%22queryType%22%3A%22traceql%22%2C%22refId%22%3A%22A%22%7D%5D%7D%7D
    profiling:
      serviceName: slack-logger
      link: https://grafana.minikube.127.0.0.1.nip.io/explore?schemaVersion=1&panes=%7B%22default%22%3A%7B%22datasource%22%3A%22pyroscope%22%2C%22queries%22%3A%5B%7B%22groupBy%22%3A%5B%5D%2C%22labelSelector%22%3A%22%7Bservice_name%3D%5C%22slack-logger%5C%22%7D%22%2C%22profileTypeId%22%3A%22process_cpu%3Acpu%3Ananoseconds%3Acpu%3Ananoseconds%22%2C%22queryType%22%3A%22profile%22%2C%22refId%22%3A%22A%22%2C%22spanSelector%22%3A%5B%5D%7D%5D%7D%7D
    metrics:
      link: https://grafana.minikube.127.0.0.1.nip.io/d/workload/workload?orgId=1&var-namespace=slack-logger&var-workload_type=deployment&var-workload=slack-logger
      labelSets:
        - labels:
            destination_service_name: slack-logger
            destination_service_namespace: slack-logger
          queries:
            - name: Request Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>}[5m])) by (response_code)
            - name: Error Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>,response_code=~"5.*"}[5m]))
            - name: P99 Latency
              template: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{<<.LabelMatchers>>}[5m])) by (le))
        - labels:
            source_workload: slack-logger
            source_workload_namespace: slack-logger
          queries:
            - name: Outbound Request Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>}[5m])) by (destination_service_name)
            - name: P99 Latency
              template: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{<<.LabelMatchers>>}[5m])) by (le))
        - labels:
            namespace: slack-logger
            workload: slack-logger
            workload_type: deployment
          queries:
            - name: CPU Usage
              template: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: CPU Throttled
              template: sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: CPU Request Utilization
              template: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (kube_pod_all_container_resource_requests{namespace="slack-logger",resource="cpu",unit="core"} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Memory Working Set
              template: sum by (pod) (container_memory_working_set_bytes{namespace="slack-logger",container!=""} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Memory Limit Utilization
              template: sum by (pod) (container_memory_working_set_bytes{namespace="slack-logger",container!=""} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (kube_pod_all_container_resource_limits{namespace="slack-logger",resource="memory",unit="byte"} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Container Restarts
              template: sum by (pod) (increase(kube_pod_all_container_status_restarts_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Receive
              template: sum by (pod) (rate(container_network_receive_bytes_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Transmit
              template: sum by (pod) (rate(container_network_transmit_bytes_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Receive Dropped
              template: sum by (pod) (rate(container_network_receive_packets_dropped_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Transmit Dropped
              template: sum by (pod) (rate(container_network_transmit_packets_dropped_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
        - labels:
            app_kubernetes_io_component: ""
            app_kubernetes_io_name: slack-logger
            namespace: slack-logger
  - name: tidb-stats-exporter
    workloadType: cronjob
    labels:
      app.kubernetes.io/component: tidb-stats-exporter
      app.kubernetes.io/name: slack-logger
    logs:
      grouping: kubernetes.slack-logger.slack-logger-tidb-stats-exporter
      link: https://grafana.minikube.127.0.0.1.nip.io/explore?schemaVersion=1&panes=%7B%22default%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22%7Bgrouping%3D%5C%22kubernetes.slack-logger.slack-logger-tidb-stats-exporter%5C%22%7D%22%7D%5D%7D%7D
    metrics:
      link: https://grafana.minikube.127.0.0.1.nip.io/d/workload/workload?orgId=1&var-namespace=slack-logger&var-workload_type=cronjob&var-workload=tidb-stats-exporter
      labelSets:
        - labels:
            destination_service_name: tidb-stats-exporter
            destination_service_namespace: slack-logger
          queries:
            - name: Request Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>}[5m])) by (response_code)
            - name: Error Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>,response_code=~"5.*"}[5m]))
            - name: P99 Latency
              template: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{<<.LabelMatchers>>}[5m])) by (le))
        - labels:
            source_workload: tidb-stats-exporter
            source_workload_namespace: slack-logger
          queries:
            - name: Outbound Request Rate
              template: sum(rate(istio_requests_total{<<.LabelMatchers>>}[5m])) by (destination_service_name)
            - name: P99 Latency
              template: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{<<.LabelMatchers>>}[5m])) by (le))
        - labels:
            namespace: slack-logger
            workload: tidb-stats-exporter
            workload_type: cronjob
          queries:
            - name: CPU Usage
              template: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: CPU Throttled
              template: sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: CPU Request Utilization
              template: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="slack-logger",container!=""}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (kube_pod_all_container_resource_requests{namespace="slack-logger",resource="cpu",unit="core"} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Memory Working Set
              template: sum by (pod) (container_memory_working_set_bytes{namespace="slack-logger",container!=""} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Memory Limit Utilization
              template: sum by (pod) (container_memory_working_set_bytes{namespace="slack-logger",container!=""} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>}) / sum by (pod) (kube_pod_all_container_resource_limits{namespace="slack-logger",resource="memory",unit="byte"} * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Container Restarts
              template: sum by (pod) (increase(kube_pod_all_container_status_restarts_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Receive
              template: sum by (pod) (rate(container_network_receive_bytes_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Transmit
              template: sum by (pod) (rate(container_network_transmit_bytes_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Receive Dropped
              template: sum by (pod) (rate(container_network_receive_packets_dropped_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
            - name: Network Transmit Dropped
              template: sum by (pod) (rate(container_network_transmit_packets_dropped_total{namespace="slack-logger"}[5m]) * on(namespace,pod) group_left() mixin_pod_workload{<<.LabelMatchers>>})
        - labels:
            app_kubernetes_io_component: tidb-stats-exporter
            app_kubernetes_io_name: slack-logger
            namespace: slack-logger
