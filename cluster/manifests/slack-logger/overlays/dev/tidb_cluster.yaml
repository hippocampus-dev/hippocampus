apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: slack-logger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  version: v8.5.0
  imagePullPolicy: IfNotPresent
  enablePVReclaim: false
  pvReclaimPolicy: Retain
  discovery: {}
  tlsCluster: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  pd:
    baseImage: ghcr.io/hippocampus-dev/hippocampus/mirror/pingcap/pd
    replicas: 1
    maxFailoverCount: 3
    requests:
      storage: "1Gi"
    config: ""
  tikv:
    baseImage: ghcr.io/hippocampus-dev/hippocampus/mirror/pingcap/tikv
    replicas: 1
    maxFailoverCount: 3
    requests:
      cpu: "25m"
      memory: "2Gi"
      storage: "10Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
    # tidb-operator always canonicalizes `config` to this TOML string form, so express it pre-canonicalized to avoid permanent ArgoCD drift
    config: |
      [storage]
        [storage.block-cache]
          capacity = "256MiB"
  tidb:
    baseImage: ghcr.io/hippocampus-dev/hippocampus/mirror/pingcap/tidb
    replicas: 1
    maxFailoverCount: 3
    service:
      type: ClusterIP
    slowLogTailer:
      image: ghcr.io/hippocampus-dev/hippocampus/mirror/busybox:1.26.2
    # tidb-operator always canonicalizes `config` to this TOML string form, so express it pre-canonicalized to avoid permanent ArgoCD drift
    config: |
      [log]
        [log.file]
          max-backups = 3
  ticdc:
    baseImage: ghcr.io/hippocampus-dev/hippocampus/mirror/pingcap/ticdc
    replicas: 1
    config: ""
