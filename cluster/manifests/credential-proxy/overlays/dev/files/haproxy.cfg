global
  maxconn 2000
resolvers kube-dns
  parse-resolv-conf
  resolve_retries 3
  timeout retry   10s
  timeout resolve 3s
  hold other      60s
  hold refused    60s
  hold nx         60s
  hold timeout    60s
  hold obsolete   60s
  hold valid      0s
defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
listen health_check_http_url
  bind :8081
  mode http
  monitor-uri /healthz
  option      dontlognull
frontend http
  bind :8080
  use_backend github if { req.hdr(host),host_only -m str github-credential-proxy.kaidotio.dev }
  default_backend not_found
backend not_found
  http-request return status 404
backend github
  http-request del-header Cookie
  http-request del-header X-Auth-Request-User
  http-request set-header Authorization "Bearer ${GITHUB_TOKEN}"
  http-request set-header Host api.github.com
  server github api.github.com:443 ssl sni str(api.github.com) verify required ca-file /etc/ssl/certs/ca-certificates.crt resolvers kube-dns resolve-prefer ipv4 init-addr last,libc,none
