apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: credential-proxy
spec:
  gateways:
    - credential-proxy
  hosts:
    - github-credential-proxy.kaidotio.dev
  http:
    - route:
        - destination:
            host: credential-proxy
            port:
              number: 8080
      retries:
        attempts: 3
        retryOn: gateway-error,retriable-4xx,connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
