apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: minio
spec:
  updatePolicy:
    updateMode: Auto
    # vpa-updater runs --min-replicas=2, which would skip this single-replica target
    minReplicas: 1
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: minio
