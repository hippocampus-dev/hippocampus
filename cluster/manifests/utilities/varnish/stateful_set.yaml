apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: varnish
spec:
  serviceName: varnish
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: &labels
      app.kubernetes.io/component: varnish
  template:
    metadata:
      labels:
        <<: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: varnish
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: varnish
          imagePullPolicy: IfNotPresent
          # Bypass docker-varnish-entrypoint, which always prepends -s malloc,$VARNISH_SIZE
          command:
            - varnishd
          args:
            - -F
            - -f
            - /etc/varnish/default.vcl
            - -a
            - http=:6081,HTTP
            - -p
            - feature=+http2
            - -s
            - malloc,$(MEMORY_REQUESTS)M
          env:
            - name: MEMORY_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: varnish
                  divisor: 1Mi
                  resource: requests.memory
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 1
            successThreshold: 3
            failureThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: varnish
              mountPath: /etc/varnish
              readOnly: true
            - name: workdir
              mountPath: /var/lib/varnish
        - name: exporter
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/hippocampus-dev/hippocampus/varnish-exporter
          imagePullPolicy: IfNotPresent
          args:
            - --address=0.0.0.0:9131
          ports:
            - name: metrics
              containerPort: 9131
              protocol: TCP
          volumeMounts:
            - name: workdir
              mountPath: /var/lib/varnish
              readOnly: true
      volumes:
        - name: varnish
          configMap:
            name: varnish
        - name: workdir
          emptyDir:
            medium: Memory
