apiVersion: descheduler/v1alpha2
kind: DeschedulerPolicy
profiles:
  - name: default
    pluginConfig:
      - name: DefaultEvictor
        args:
          evictSystemCriticalPods: true
          evictFailedBarePods: true
          evictLocalStoragePods: true
          # PodFitsAnyOtherNode excludes the pod's own node, so nothing ever fits on a single node cluster
          nodeFit: false
          ignorePodsWithoutPDB: true
      - name: RemovePodsViolatingTopologySpreadConstraint
        args:
          topologyBalanceNodeFit: true
          constraints:
            - DoNotSchedule
            - ScheduleAnyway
          labelSelector:
            matchExpressions:
              # statefulset often has PVC so cannot be rescheduled
              - key: statefulset.kubernetes.io/pod-name
                operator: DoesNotExist
              # descheduler counts completed pods as violators
              - key: job-name
                operator: DoesNotExist
      # This strategy finds nodes that are under utilized and evicts pods, if possible, from other nodes in the hope that recreation of evicted pods will be scheduled on these underutilized nodes. The parameters of this strategy are configured under nodeResourceUtilizationThresholds.
      - name: LowNodeUtilization
        args:
          thresholds:
            cpu : 30
            memory: 50
          targetThresholds:
            cpu : 60
            memory: 80
          metricsUtilization:
            metricsServer: true
    plugins:
      deschedule:
        enabled:
          - RemovePodsViolatingTopologySpreadConstraint
      balance:
        enabled:
          - LowNodeUtilization
  # Returns a pod that fell back to minikube to the LAN worker it prefers once that worker is back
  - name: preferred-node
    pluginConfig:
      - name: DefaultEvictor
        args:
          evictSystemCriticalPods: true
          evictLocalStoragePods: true
          # https://github.com/kubernetes-sigs/descheduler/blob/v0.32.1/pkg/framework/plugins/removepodsviolatingnodeaffinity/node_affinity.go counts the pod's own node as a fit
          nodeFit: true
          ignorePodsWithoutPDB: true
      - name: RemovePodsViolatingNodeAffinity
        args:
          nodeAffinityType:
            - preferredDuringSchedulingIgnoredDuringExecution
    plugins:
      deschedule:
        enabled:
          - RemovePodsViolatingNodeAffinity
  - name: failed-pods
    pluginConfig:
      - name: DefaultEvictor
        args:
          evictSystemCriticalPods: true
          evictFailedBarePods: true
          evictLocalStoragePods: true
          evictDaemonSetPods: true
          nodeFit: false
          ignorePodsWithoutPDB: false
      - name: RemoveFailedPods
        args:
          reasons:
            - OutOfcpu
            - OutOfmemory
            - OutOfephemeral-storage
            - OutOfpods
            - UnexpectedAdmissionError
            - NodeAffinity
            - Evicted
            - NodeShutdown
            - Terminated
            # Evicted pods whose container status was synced after(https://github.com/kubernetes/kubernetes/issues/105467)
            - ContainerStatusUnknown
          includingInitContainers: true
    plugins:
      deschedule:
        enabled:
          - RemoveFailedPods
