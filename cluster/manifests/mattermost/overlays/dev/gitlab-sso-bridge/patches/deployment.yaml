apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-sso-bridge
spec:
  replicas: 1
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: gitlab-sso-bridge
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: gitlab-sso-bridge
      containers:
        - name: gitlab-sso-bridge
          args:
            - --client-id=mattermost
            - --client-secret=$(GITLAB_SECRET)
            # https://github.com/mattermost/mattermost/blob/master/server/channels/app/oauth.go builds this from SiteURL for both the login and the signup entry point
            - --redirect-uri=https://mattermost.kaidotio.dev/signup/gitlab/complete
            - --email-domain=kaidotio.dev
          envFrom:
            - secretRef:
                name: mattermost-gitlab
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 128Mi
