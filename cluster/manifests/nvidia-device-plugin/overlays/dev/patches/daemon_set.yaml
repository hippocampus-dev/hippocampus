apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: nvidia-device-plugin
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 1000m
              memory: 128Mi
