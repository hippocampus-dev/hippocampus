apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        # The sidecar's access log carries the text of every query and series selector Grafana proxies
        loganomaly.kaidotio.github.io/istio-proxy.exclude-regex: '[?&](query|match%5B%5D)='
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # files/usr/local/bin/minikube-worker.sh joins LAN workers with this label
                  - key: node.kaidotio.github.io/remote-worker
                    operator: In
                    values:
                      - lan
      tolerations:
        - key: node.kaidotio.github.io/remote-worker
          operator: Equal
          value: lan
          effect: NoSchedule
        # Overrides the 86400s files/usr/local/bin/minikube-start.sh sets, so the pod leaves a vanished LAN worker
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/component: ""
      containers:
        - name: grafana
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.minikube.127.0.0.1.nip.io
          resources:
            requests:
              cpu: 25m
              memory: 205Mi
            limits:
              cpu: 1000m
              memory: 384Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 1000m
              memory: 24Mi
      volumes:
        - name: datasources
          configMap:
            name: datasources
