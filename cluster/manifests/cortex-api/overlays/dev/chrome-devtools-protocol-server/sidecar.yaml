apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: chrome-devtools-protocol-server
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/component: chrome-devtools-protocol-server
  outboundTrafficPolicy:
    mode: ALLOW_ANY # Chromium is pointed at pages outside the mesh
  egress:
    - captureMode: DEFAULT
      hosts:
        - istio-system/istiod.istio-system.svc.cluster.local
        - otel/otel-agent.otel.svc.cluster.local
