apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chrome-devtools-protocol-server
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # files/usr/local/bin/minikube-worker.sh joins LAN workers with this label
                  - key: node.kaidotio.github.io/remote-worker
                    operator: In
                    values:
                      - lan
      tolerations:
        - key: node.kaidotio.github.io/remote-worker
          operator: Equal
          value: lan
          effect: NoSchedule
        # Overrides the 86400s files/usr/local/bin/minikube-start.sh sets, so the pod leaves a vanished LAN worker
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
