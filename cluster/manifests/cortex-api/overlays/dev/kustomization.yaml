apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cortex-api

resources:
- ../../base
- authorization_policy.yaml
- destination_rule.yaml
- envoy_filter.yaml
- gateway.yaml
- namespace.yaml
- network_policy.yaml
- peer_authentication.yaml
- request_authentication.yaml
- service_entry.yaml
- sidecar.yaml
- telemetry.yaml
- virtual_service.yaml
- waypoint.yaml
- redis
- varnish
- tls-intercept-proxy
- ext-proc-proxy
- chrome-devtools-protocol-server

