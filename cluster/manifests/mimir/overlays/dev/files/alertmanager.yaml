global: null
receivers:
  - name: slack
    slack_configs:
      - api_url: http://mattermost.mattermost.svc.cluster.local:8080/hooks/mattermost/mattermost
        send_resolved: true
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} - {{ .CommonLabels.severity | toUpper }}
        text: >-
          {{ if eq .Status "firing" }}<!here>{{ end }}

          {{ with index .Alerts 0 }}<{{ if match "[?&]g0\\.expr=" .GeneratorURL }}{{ if eq .Status "firing" }}{{ grafanaExploreURL "https://grafana.kaidotio.dev" "prometheus" "now-1h" "now" (queryFromGeneratorURL .GeneratorURL) }}{{ else }}{{ grafanaExploreURL "https://grafana.kaidotio.dev" "prometheus" (printf "%d" (.EndsAt.Add -3600000000000).UnixMilli) (printf "%d" .EndsAt.UnixMilli) (queryFromGeneratorURL .GeneratorURL) }}{{ end }}{{ else }}{{ .GeneratorURL }}{{ end }}|Show in graph>{{ end }}{{ if eq .Status "firing" }} | <{{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ if ne .Name "alertname" }}{{ .Name }}%3D"{{ .Value }}"%2C%20{{ end }}{{ end }}alertname%3D"{{ .CommonLabels.alertname }}"%7D|Silence>{{ end }}

          {{ range .Alerts -}}
          {{ .Annotations.message }}
            {{ range .Labels.SortedPairs }} - {{ .Name }}=`{{ .Value }}`
            {{ end }}

          {{ end }}
  - name: alerthandler
    webhook_configs:
      - url: 'http://alerthandler.alerthandler.svc.cluster.local'
        send_resolved: true
route:
  group_wait: 30s
  group_interval: 5m
  group_by: [alertname]
  receiver: slack
  routes:
    # alerthandler matches only open issues (listOpenIssues in cluster/applications/alerthandler/handler/critical_alert_handler.go)
    - match_re:
        alertname: loganomaly_.*
      repeat_interval: 24h
      receiver: alerthandler
      continue: true
    - match_re:
        alertname: loganomaly_.*
      repeat_interval: 24h
    - match:
        severity: critical
      repeat_interval: 1h
      receiver: alerthandler
      continue: true
    - match:
        severity: warning
      repeat_interval: 24h
      receiver: alerthandler
      continue: true
    - match:
        severity: critical
      repeat_interval: 1h
    - match:
        severity: warning
      repeat_interval: 24h
inhibit_rules:
  - source_match:
      scope: 'application'
    target_match:
      scope: 'uri'
    equal: ['alertname', 'vhost']
