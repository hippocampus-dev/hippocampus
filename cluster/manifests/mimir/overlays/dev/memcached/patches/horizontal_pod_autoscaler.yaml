apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcrouter
spec:
  maxReplicas: 3
  minReplicas: 3
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: mcrouter
        target:
          type: Utilization
          averageUtilization: 80
    - type: ContainerResource
      containerResource:
        name: cpu
        container: istio-proxy
        target:
          type: AverageValue
          averageValue: 500m
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
