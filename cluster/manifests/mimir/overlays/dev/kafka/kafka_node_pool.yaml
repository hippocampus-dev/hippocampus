apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  labels:
    strimzi.io/cluster: mimir-ingest
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 1Gi
  template:
    pod:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
