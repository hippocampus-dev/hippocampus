apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: mimir-ingest
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    replicas: 1
    jvmOptions:
      # -Xms below -Xmx so the heap grows lazily to the live set instead of
      # committing the full resources-derived 50% up front (combined node)
      -Xms: 256m
      -Xmx: 1024m
    config:
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          useServiceDnsDomain: true
  entityOperator:
    topicOperator:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi
  kafkaExporter:
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/scheme: http
            prometheus.io/port: "9404"
            prometheus.io/path: /metrics
