apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  replicas: 1
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        prometheus.io/scrape: "true"
        prometheus.io/scheme: http
        prometheus.io/port: "9000"
        prometheus.io/path: /minio/prometheus/metrics
        relocatable-volume-controller.kaidotio.github.io/volumes: data
        relocatable-volume-controller.kaidotio.github.io/method: transfer
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # files/usr/local/bin/minikube-worker.sh joins LAN workers with this label
                  - key: node.kaidotio.github.io/remote-worker
                    operator: In
                    values:
                      - lan
      tolerations:
        - key: node.kaidotio.github.io/remote-worker
          operator: Equal
          value: lan
          effect: NoSchedule
        # Overrides the 86400s files/usr/local/bin/minikube-start.sh sets, so the pod leaves a vanished LAN worker
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - controller-revision-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: minio
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - controller-revision-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: minio
      initContainers:
        - name: mc
          restartPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: minio/mc
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -e

              until curl -fs http://127.0.0.1:9000/minio/health/ready > /dev/null; do
                sleep 1
              done
              mc mb -p minio/mimir
              trap 'exit 0' TERM
              sleep infinity &
              wait
          env:
            - name: MC_HOST_minio
              value: http://minio:miniominio@127.0.0.1:9000
          volumeMounts:
            - name: mc
              mountPath: /.mc
      containers:
        - name: minio
          volumeMounts:
            - name: data
              mountPath: /var/minio
      volumes:
        - name: mc
          emptyDir:
            medium: Memory
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
