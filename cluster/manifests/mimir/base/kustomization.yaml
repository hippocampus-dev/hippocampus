apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- horizontal_pod_autoscaler.yaml
- pod_disruption_budget.yaml
- service.yaml
- stateful_set.yaml

configMapGenerator:
- files:
  - files/nginx.conf
  name: mimir-proxy
  options:
    immutable: true
- files:
  - files/system.alerts.rules
  name: system.alerts.rules
  options:
    immutable: true
- files:
  - files/kube-apiserver.alerts.rules
  name: kube-apiserver.alerts.rules
  options:
    immutable: true
- files:
  - files/record.rules
  name: record.rules
  options:
    immutable: true
- files:
  - files/kube-system/cilium-operator.alerts.rules
  name: cilium-operator.alerts.rules
  options:
    immutable: true
- files:
  - files/etcd.alerts.rules
  name: etcd.alerts.rules
  options:
    immutable: true
- files:
  - files/customresourcestate.alerts.rules
  name: customresourcestate.alerts.rules
  options:
    immutable: true

images:
- digest: sha256:512a8b387845c5b05c64cfcba2bad893acef214c138c47f2f744716ded01932c
  name: grafana/mimir
  newName: ghcr.io/hippocampus-dev/hippocampus/mirror/grafana/mimir
- digest: sha256:c20cc0fb2627491f6d0c6eb08eb3a0f892c26effd559607742128b65f11436e1
  name: nginx
  newName: ghcr.io/hippocampus-dev/hippocampus/mirror/nginx
