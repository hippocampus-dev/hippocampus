apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alerthandler

resources:
  - ../../base
  - namespace.yaml
  - network_policy.yaml
  - peer_authentication.yaml
  - service_entry.yaml
  - sidecar.yaml
  - telemetry.yaml

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - --grafana-alerts-url=https://grafana.kaidotio.dev/alerting/groups?alertmanager=Alertmanager
    target:
      group: serving.knative.dev
      version: v1
      kind: Service
      name: alerthandler

generators:
  - secrets_from_vault.yaml

images:
  - name: ghcr.io/hippocampus-dev/hippocampus/alerthandler
    newName: ghcr.io/hippocampus-dev/hippocampus/alerthandler
