apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki-ingester
spec:
  replicas: 1
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        prometheus.io/scrape: "true"
        prometheus.io/scheme: http
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
        # Loki only warns when memcached rejects a cache write
        loganomaly.kaidotio.github.io/ingester.exclude-regex: 'SERVER_ERROR out of memory storing object'
        relocatable-volume-controller.kaidotio.github.io/volumes: data
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # files/usr/local/bin/minikube-worker.sh joins LAN workers with this label
                  - key: node.kaidotio.github.io/remote-worker
                    operator: In
                    values:
                      - lan
      tolerations:
        - key: node.kaidotio.github.io/remote-worker
          operator: Equal
          value: lan
          effect: NoSchedule
        # Overrides the 86400s files/usr/local/bin/minikube-start.sh sets, so the pod leaves a vanished LAN worker
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - controller-revision-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/component: ingester
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - controller-revision-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/component: ingester
      containers:
        - name: ingester
          env:
            - name: JAEGER_ENDPOINT
              value: http://otel-agent.otel.svc.cluster.local:14268/api/traces
            - name: JAEGER_SAMPLER_TYPE
              value: const
            - name: JAEGER_SAMPLER_PARAM
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: loki
              mountPath: /mnt
            - name: data
              mountPath: /var/loki
      volumes:
        - name: loki
          configMap:
            name: loki
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
