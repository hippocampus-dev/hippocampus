apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
spec:
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: node-local-dns
      app.kubernetes.io/component: ""
  template:
    metadata:
      labels:
        <<: *labels
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - effect: NoSchedule
          operator: Exists
      automountServiceAccountToken: false
      dnsPolicy: Default
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-local-dns
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            # https://github.com/containerd/containerd/blob/v2.0.0/pkg/oci/spec.go#L118
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # the image ships no USER and :53 is bound through NET_BIND_SERVICE, which needs uid 0
            #runAsUser: 65532
            #runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: registry.k8s.io/dns/k8s-dns-node-cache
          imagePullPolicy: IfNotPresent
          args:
            # inert with the setup flags off, but the binary refuses to start without it
            - -localip=169.254.20.10,10.96.0.10
            - -conf=/etc/coredns/Corefile
            - -basecorefile=/mnt/Corefile.base
            - -upstreamsvc=kube-dns-upstream
            # Cilium redirects the kube-dns ClusterIP here, so the dummy interface and the iptables rules are its job
            - -setupinterface=false
            - -setupiptables=false
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
          ports:
            - name: http
              containerPort: 8053
              protocol: TCP
            - name: metrics
              containerPort: 9253
              protocol: TCP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns
              containerPort: 53
              protocol: UDP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 1
            successThreshold: 1
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "[ ! -f /etc/coredns/terminating ]"
            periodSeconds: 1
            successThreshold: 1
            failureThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "rm -f /etc/coredns/terminating"
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "> /etc/coredns/terminating; sleep 5"
          volumeMounts:
            - name: tmp
              mountPath: /etc/coredns
            - name: node-local-dns
              mountPath: /mnt
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: node-local-dns
          configMap:
            name: node-local-dns
