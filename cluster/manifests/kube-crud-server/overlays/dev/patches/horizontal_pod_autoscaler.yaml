apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kube-crud-server
spec:
  maxReplicas: 3
  minReplicas: 1
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: kube-crud-server
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
