apiVersion: apps/v1
kind: Deployment
metadata:
  name: tauri-releases
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tauri-releases
              app.kubernetes.io/component: ""
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tauri-releases
              app.kubernetes.io/component: ""
      containers:
        - name: tauri-releases
          envFrom:
            - secretRef:
                name: tauri-releases
          env:
            - name: CLIENT_ID
              value: 1070864848239-vopgpdhdijeecfshlegcbp66bfkddqom.apps.googleusercontent.com
            - name: REDIRECT_URI
              value: https://tauri-releases-public.kaidotio.dev/callback
            - name: ALLOWED_EMAILS
              value: kaidotio@gmail.com
          resources:
            requests:
              cpu: 5m
