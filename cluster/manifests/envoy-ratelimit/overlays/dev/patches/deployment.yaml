apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ratelimit
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy-ratelimit
              app.kubernetes.io/component: ""
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy-ratelimit
              app.kubernetes.io/component: ""
      containers:
        - name: envoy-ratelimit
          env:
          - name: LOG_LEVEL
            value: info
          - name: USE_STATSD
            value: "true"
          - name: STATSD_HOST
            value: envoy-ratelimit-statsd.envoy-ratelimit.svc.cluster.local
          - name: STATSD_PORT
            value: "9125"
          - name: STATS_FLUSH_INTERVAL
            value: "15s"
          - name: BACKEND_TYPE
            value: memcache
          - name: MEMCACHE_HOST_PORT
            value: envoy-ratelimit-mcrouter.envoy-ratelimit.svc.cluster.local:5000
          - name: MEMCACHE_MAX_IDLE_CONNS
            value: "10"
          - name: CONFIG_TYPE
            value: GRPC_XDS_SOTW
          - name: CONFIG_GRPC_XDS_SERVER_URL
            value: envoy-ratelimit-controller.envoy-ratelimit-controller.svc.cluster.local:18000
          # Keeps a new replica out of the Service until it has received a config from envoy-ratelimit-controller
          - name: HEALTHY_WITH_AT_LEAST_ONE_CONFIG_LOADED
            value: "true"
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 1000m
              memory: 16Mi
