apiVersion: apps/v1
kind: Deployment
metadata:
  name: strimzi-cluster-operator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: strimzi-cluster-operator
      app.kubernetes.io/component: ""
  template:
    metadata:
      labels:
        <<: *labels
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        traffic.sidecar.istio.io/excludeOutboundPorts: "9091" # Kafka replication listener the Cluster Operator dials
        prometheus.io/scrape: "true"
        prometheus.io/scheme: http
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # files/usr/local/bin/minikube-worker.sh joins LAN workers with this label
                  - key: node.kaidotio.github.io/remote-worker
                    operator: In
                    values:
                      - lan
      tolerations:
        - key: node.kaidotio.github.io/remote-worker
          operator: Equal
          value: lan
          effect: NoSchedule
        # Overrides the 86400s files/usr/local/bin/minikube-start.sh sets, so the pod leaves a vanished LAN worker
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          #minDomains: 3
          #whenUnsatisfiable: DoNotSchedule
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: strimzi-cluster-operator
      containers:
        - name: strimzi-cluster-operator
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # Override upstream defaults (limits: memory 384Mi)
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 1Gi
