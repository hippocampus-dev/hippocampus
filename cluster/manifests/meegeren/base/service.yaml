apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: meegeren
  labels:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # A Revision starting with a pod would hold the GPU the other pipelines wait for
        autoscaling.knative.dev/initial-scale: "0"
        sidecar.istio.io/proxyCPULimit: 1000m
        sidecar.istio.io/proxyMemoryLimit: 1Gi
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        prometheus.io/scrape: "true"
        prometheus.io/scheme: http
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: meegeren
        sidecar.istio.io/inject: "true"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containerConcurrency: 0
      timeoutSeconds: 600
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meegeren
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/hippocampus-dev/hippocampus/meegeren
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: warning
            - name: MODEL_DIRECTORY
              value: /mnt/.cache/meegeren
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-agent.otel.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "5000"
            - name: OTEL_BSP_EXPORT_TIMEOUT
              value: "30000"
            - name: OTEL_BSP_MAX_QUEUE_SIZE
              value: "2048"
            - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
              value: "512"
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          ports:
            - name: http1
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
          volumeMounts:
            - name: cache
              mountPath: /mnt/.cache
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: meegeren
            readOnly: true
        - name: tmp
          emptyDir:
            medium: Memory
