apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -quality-sam3

resources:
  - ../../../base

patches:
  - patch: |-
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1component
        value: quality-sam3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PIPELINE
          value: quality-sam3
    target:
      group: serving.knative.dev
      version: v1
      kind: Service
      name: meegeren
