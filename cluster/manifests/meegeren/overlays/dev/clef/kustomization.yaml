apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -clef

resources:
  - ../../../base

patches:
  - patch: |-
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1component
        value: clef
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENHANCER
          value: clef
    target:
      group: serving.knative.dev
      version: v1
      kind: Service
      name: meegeren
