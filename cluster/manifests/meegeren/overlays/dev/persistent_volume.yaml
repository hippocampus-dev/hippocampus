apiVersion: v1
kind: PersistentVolume
metadata:
  name: meegeren
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Knative Service takes no nfs volume, only a claim
  nfs:
    server: host.minikube.internal
    path: /srv/nfs/.cache
