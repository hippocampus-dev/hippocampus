version: 2
before:
  hooks:
    # https://github.com/cross-rs/cross/blob/v0.2.5/src/docker/shared.rs#L329-L341
    - mkdir -p target
builds:
  - id: insight
    main: dummy.go
    binary: insight
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      post: bash goreleaser.sh insight
  - id: l7sniff
    main: dummy.go
    binary: l7sniff
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      post: bash goreleaser.sh l7sniff

changelog:
  disable: true

checksum:
  split: true

archives:
  - format: binary
