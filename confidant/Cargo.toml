[package]
name = "confidant"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"

[dependencies]
error = { path = "../packages/error" }
clap = { version = "4.5.38", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["image", "randr", "xfixes", "xkb"] }
ab_glyph = { version = "0.2.32" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
